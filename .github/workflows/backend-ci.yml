name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: walletapp_test
          POSTGRES_USER: walletapp
          POSTGRES_PASSWORD: walletapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walletapp -d walletapp_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://walletapp:walletapp@localhost:5432/walletapp_test
      DATABASE_URL: postgresql+psycopg://walletapp:walletapp@localhost:5432/walletapp_test
      JWT_SECRET: ci-test-secret-with-at-least-32-bytes
      REFRESH_COOKIE_SECURE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Ruff
        run: ruff check app tests

      - name: Run mypy
        run: mypy app

      - name: Apply and verify migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run integration tests
        run: pytest tests/integration -q

      - name: Run end-to-end tests
        run: pytest tests/e2e -q

      - name: Enforce critical coverage
        run: >-
          pytest -q
          --cov=app.domain
          --cov=app.api.v1.routers.accounts
          --cov=app.api.v1.routers.movements
          --cov=app.api.v1.routers.balance
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
